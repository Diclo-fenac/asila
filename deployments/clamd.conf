Foreground yes
PidFile /tmp/clamd.pid
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /run/asila-scanner/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
MaxThreads 2
MaxQueue 8
MaxScanTime 30000
StreamMaxLength 64M
MaxFileSize 64M
MaxScanSize 128M
MaxRecursion 8
MaxFiles 2048
AlertExceedsMax yes
AlertEncrypted yes
ScanPDF yes
ScanXMLDOCS yes
ScanOLE2 yes
LogClean no
LogTime no
