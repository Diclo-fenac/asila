services:
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    environment:
      POSTGRES_USER: asila_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Asila}
      POSTGRES_DB: asila_platform
      ASILA_DB_APP_PASSWORD: ${ASILA_DB_APP_PASSWORD:?Set ASILA_DB_APP_PASSWORD before starting Asila}
      ASILA_DB_MIGRATOR_PASSWORD: ${ASILA_DB_MIGRATOR_PASSWORD:?Set ASILA_DB_MIGRATOR_PASSWORD before starting Asila}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asila_admin -d asila_platform"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: >-
      sh -c "alembic -c alembic.platform.ini upgrade head &&
      alembic -c alembic.app.ini upgrade head"
    environment:
      DATABASE_URL: postgresql+asyncpg://asila_migrator:${ASILA_DB_MIGRATOR_PASSWORD}@postgres:5432/asila_platform
      POSTGRES_HOST: postgres
      POSTGRES_USER: asila_migrator
      POSTGRES_PASSWORD: ${ASILA_DB_MIGRATOR_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    ports:
      - "127.0.0.1:${ASILA_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://asila_app:${ASILA_DB_APP_PASSWORD}@postgres:5432/asila_platform
      POSTGRES_HOST: postgres
      ASILA_STORAGE_ROOT: /var/lib/asila/private
      ASILA_SCANNER_SOCKET: /run/asila-scanner/clamd.sock
      ASILA_PARSER_SOCKET: /run/asila-parser/parser.sock
      ASILA_SCANNER_MAX_AGE_DAYS: ${ASILA_SCANNER_MAX_AGE_DAYS:-7}
      POSTGRES_USER: asila_app
      POSTGRES_PASSWORD: ${ASILA_DB_APP_PASSWORD}
      ASILA_SETUP_TOKEN: ${ASILA_SETUP_TOKEN:?Set ASILA_SETUP_TOKEN before starting Asila}
      ASILA_MASTER_KEY: ${ASILA_MASTER_KEY:?Set ASILA_MASTER_KEY before starting Asila}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - private_documents:/var/lib/asila/private
      - scanner_socket:/run/asila-scanner:ro
      - parser_socket:/run/asila-parser:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "workers/core.py"]
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    environment:
      DATABASE_URL: postgresql+asyncpg://asila_app:${ASILA_DB_APP_PASSWORD}@postgres:5432/asila_platform
      POSTGRES_HOST: postgres
      ASILA_STORAGE_ROOT: /var/lib/asila/private
      ASILA_SCANNER_SOCKET: /run/asila-scanner/clamd.sock
      ASILA_PARSER_SOCKET: /run/asila-parser/parser.sock
      ASILA_SCANNER_MAX_AGE_DAYS: ${ASILA_SCANNER_MAX_AGE_DAYS:-7}
      POSTGRES_USER: asila_app
      POSTGRES_PASSWORD: ${ASILA_DB_APP_PASSWORD}
      ASILA_MASTER_KEY: ${ASILA_MASTER_KEY:?Set ASILA_MASTER_KEY before starting Asila}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      DOCLING_URL: ${DOCLING_URL:-http://docling:5001}
    volumes:
      - private_documents:/var/lib/asila/private:ro
      - scanner_socket:/run/asila-scanner:ro
      - parser_socket:/run/asila-parser:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  document_parser:
    profiles: ["document-processing"]
    build:
      context: ..
      dockerfile: deployments/docling.Dockerfile
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    cpus: 2
    mem_limit: 6g
    environment:
      HOME: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    volumes:
      - parser_socket:/run/asila-parser

  document_scanner:
    profiles: ["document-processing"]
    build:
      context: ..
      dockerfile: deployments/scanner.Dockerfile
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    cpus: 1
    mem_limit: 2g
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    volumes:
      - scanner_socket:/run/asila-scanner
      - type: bind
        source: ${ASILA_CLAMAV_DATABASE_DIR:-./clamav-signatures}
        target: /var/lib/clamav
        read_only: true
        bind:
          create_host_path: false

volumes:
  scanner_socket:
  parser_socket:
  private_documents:
  postgres_data:
  ollama_data:
